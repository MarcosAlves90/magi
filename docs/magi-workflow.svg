<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">Magi human-reviewed memory workflow</title>
  <desc id="desc">Pending proposals are inspected and explicitly approved or rejected through Hermes. Stored memory can optionally be reviewed or compacted with AI, but changes are applied only after inspecting the preview and confirming Apply.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151a"/>
      <stop offset="1" stop-color="#17211d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#79c99b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f4f6f5; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #aab6af; font-size: 16px; }
      .lane { fill: #91a49a; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .card { fill: #19231f; stroke: #344a3d; stroke-width: 1.5; }
      .card-accent { fill: #1b2722; stroke: #79c99b; stroke-width: 2; }
      .card-title { fill: #f1f5f2; font-size: 16px; font-weight: 650; }
      .card-copy { fill: #aab8af; font-size: 13px; }
      .arrow { fill: none; stroke: #79c99b; stroke-width: 2.5; marker-end: url(#arrow); }
      .note { fill: #d7e5dc; font-size: 15px; font-weight: 550; }
      .chip { fill: #22372b; stroke: #456d53; }
      .chip-text { fill: #a4e0b8; font-size: 12px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1280" height="690" rx="24" fill="url(#background)"/>
  <text class="title" x="48" y="58">A human-reviewed memory workflow</text>
  <text class="subtitle" x="48" y="88">Magi keeps every decision visible—and every write intentional.</text>

  <text class="lane" x="50" y="132">PENDING PROPOSALS</text>
  <g transform="translate(48 154)">
    <rect class="card" width="182" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">Hermes stages</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">A proposed change</tspan><tspan x="18" dy="20">waits in the queue.</tspan></text>
  </g>
  <path class="arrow" d="M238 225h22"/>
  <g transform="translate(270 154)">
    <rect class="card" width="182" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">Pending writes</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">Search, filter and</tspan><tspan x="18" dy="20">choose a proposal.</tspan></text>
  </g>
  <path class="arrow" d="M460 225h22"/>
  <g transform="translate(492 154)">
    <rect class="card" width="182" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">Inspect</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">Compare proposal,</tspan><tspan x="18" dy="20">diff and verification.</tspan></text>
  </g>
  <path class="arrow" d="M682 225h22"/>
  <g transform="translate(714 154)">
    <rect class="card-accent" width="182" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">You decide</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">Approve or reject</tspan><tspan x="18" dy="20">with an explicit action.</tspan></text>
    <rect class="chip" x="18" y="104" width="104" height="23" rx="11"/>
    <text class="chip-text" x="31" y="120">NO AUTO-APPLY</text>
  </g>
  <path class="arrow" d="M904 225h22"/>
  <g transform="translate(936 154)">
    <rect class="card" width="286" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">Hermes native memory APIs</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">Hermes validates and persists</tspan><tspan x="18" dy="20">approved changes to MEMORY.md</tspan><tspan x="18" dy="20">or USER.md.</tspan></text>
  </g>

  <text class="lane" x="50" y="356">STORED MEMORY · OPTIONAL AI ASSISTANCE</text>
  <g transform="translate(48 378)">
    <rect class="card" width="204" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">Stored memory</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">Search, add or edit</tspan><tspan x="18" dy="20">entries and inspect limits.</tspan></text>
  </g>
  <path class="arrow" d="M260 449h28"/>
  <g transform="translate(300 378)">
    <rect class="card" width="204" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">Optional AI preview</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">Ask Hermes' configured</tspan><tspan x="18" dy="20">model for review or compaction.</tspan></text>
  </g>
  <path class="arrow" d="M512 449h28"/>
  <g transform="translate(552 378)">
    <rect class="card" width="204" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">Review the proposal</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">Inspect suggested text,</tspan><tspan x="18" dy="20">entries and diff first.</tspan></text>
  </g>
  <path class="arrow" d="M764 449h28"/>
  <g transform="translate(804 378)">
    <rect class="card-accent" width="204" height="142" rx="16"/>
    <text class="card-title" x="18" y="36">Apply explicitly</text>
    <text class="card-copy" x="18" y="66"><tspan x="18">Only your confirmation</tspan><tspan x="18" dy="20">can submit a compaction.</tspan></text>
    <rect class="chip" x="18" y="104" width="112" height="23" rx="11"/>
    <text class="chip-text" x="31" y="120">PREVIEW FIRST</text>
  </g>
  <path class="arrow" d="M1016 449h28"/>
  <g transform="translate(1056 378)">
    <rect class="card" width="166" height="142" rx="16"/>
    <text class="card-title" x="16" y="36">Hermes writes</text>
    <text class="card-copy" x="16" y="66"><tspan x="16">Native safeguards</tspan><tspan x="16" dy="20">remain in control.</tspan></text>
  </g>
  <path class="arrow" d="M1139 530v45H150v-43"/>

  <rect x="48" y="596" width="1174" height="58" rx="14" fill="#1c2922" stroke="#3b5c46"/>
  <text class="note" x="72" y="631">AI suggestions never write automatically. Hermes owns provider permissions and native memory persistence.</text>
</svg>
