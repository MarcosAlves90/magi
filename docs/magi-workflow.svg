<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Magi human-reviewed memory workflow</title>
  <desc id="desc">Hermes pending proposals are inspected and explicitly approved or rejected. Stored memory can optionally be reviewed or compacted with AI, but changes are applied only after inspecting the preview and confirming Apply.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151a"/>
      <stop offset="1" stop-color="#17211d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#79c99b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f4f6f5; font-size: 32px; font-weight: 700; }
      .subtitle { fill: #aab6af; font-size: 18px; }
      .lane { fill: #91a49a; font-size: 14px; font-weight: 700; letter-spacing: 1.6px; }
      .card { fill: #19231f; stroke: #344a3d; stroke-width: 1.5; }
      .card-accent { fill: #1b2722; stroke: #79c99b; stroke-width: 2; }
      .card-title { fill: #f1f5f2; font-size: 22px; font-weight: 650; }
      .card-copy { fill: #aab8af; font-size: 18px; }
      .arrow { fill: none; stroke: #79c99b; stroke-width: 2.5; marker-end: url(#arrow); }
      .bar-title { fill: #f1f5f2; font-size: 24px; font-weight: 700; }
      .bar-copy { fill: #aab8af; font-size: 17px; }
      .note { fill: #d7e5dc; font-size: 16px; font-weight: 550; }
      .chip { fill: #22372b; stroke: #456d53; }
      .chip-text { fill: #a4e0b8; font-size: 12px; font-weight: 700; letter-spacing: .5px; }
    </style>
  </defs>
  <rect width="960" height="700" rx="24" fill="url(#background)"/>
  <text class="title" x="40" y="58">A human-reviewed memory workflow</text>
  <text class="subtitle" x="40" y="88">Magi keeps every decision visible—and every write intentional.</text>

  <text class="lane" x="40" y="126">PENDING PROPOSALS</text>
  <g transform="translate(40 145)">
    <rect class="card" width="276" height="142" rx="16"/>
    <text class="card-title" x="20" y="40">Hermes stages</text>
    <text class="card-copy" x="20" y="78"><tspan x="20">A proposed change waits</tspan><tspan x="20" dy="25">in the Magi queue.</tspan></text>
  </g>
  <path class="arrow" d="M322 216h14"/>
  <g transform="translate(342 145)">
    <rect class="card" width="276" height="142" rx="16"/>
    <text class="card-title" x="20" y="40">Inspect proposal</text>
    <text class="card-copy" x="20" y="78"><tspan x="20">Compare the proposal,</tspan><tspan x="20" dy="25">diff and target store.</tspan></text>
  </g>
  <path class="arrow" d="M624 216h14"/>
  <g transform="translate(644 145)">
    <rect class="card-accent" width="276" height="142" rx="16"/>
    <text class="card-title" x="20" y="40">You decide</text>
    <text class="card-copy" x="20" y="78"><tspan x="20">Approve or reject with</tspan><tspan x="20" dy="25">an explicit action.</tspan></text>
    <rect class="chip" x="20" y="108" width="124" height="22" rx="11"/>
    <text class="chip-text" x="32" y="123">NO AUTO-APPLY</text>
  </g>
  <path class="arrow" d="M782 287v48"/>

  <rect x="140" y="335" width="680" height="80" rx="18" fill="#202c25" stroke="#496a53" stroke-width="1.5"/>
  <text class="bar-title" x="170" y="370">Hermes native MemoryStore</text>
  <text class="bar-copy" x="170" y="396">Persists approved changes to MEMORY.md / USER.md</text>

  <text class="lane" x="40" y="457">STORED MEMORY · OPTIONAL AI ASSISTANCE</text>
  <g transform="translate(40 480)">
    <rect class="card" width="276" height="140" rx="16"/>
    <text class="card-title" x="20" y="40">Stored memory</text>
    <text class="card-copy" x="20" y="78"><tspan x="20">Search or edit</tspan><tspan x="20" dy="25">MEMORY.md / USER.md.</tspan></text>
  </g>
  <path class="arrow" d="M322 550h14"/>
  <g transform="translate(342 480)">
    <rect class="card" width="276" height="140" rx="16"/>
    <text class="card-title" x="20" y="40">Optional AI preview</text>
    <text class="card-copy" x="20" y="78"><tspan x="20">Use Hermes' configured</tspan><tspan x="20" dy="25">model to review or compact.</tspan></text>
  </g>
  <path class="arrow" d="M624 550h14"/>
  <g transform="translate(644 480)">
    <rect class="card-accent" width="276" height="140" rx="16"/>
    <text class="card-title" x="20" y="40">Review, then apply</text>
    <text class="card-copy" x="20" y="78"><tspan x="20">Compare the proposal and</tspan><tspan x="20" dy="25">diff; confirm before writing.</tspan></text>
    <rect class="chip" x="20" y="105" width="112" height="22" rx="11"/>
    <text class="chip-text" x="32" y="120">PREVIEW FIRST</text>
  </g>
  <path class="arrow" d="M782 480v-65"/>

  <rect x="40" y="650" width="880" height="36" rx="12" fill="#1c2922" stroke="#3b5c46"/>
  <text class="note" x="58" y="674">AI suggestions never write automatically. Hermes owns provider permissions and memory persistence.</text>
</svg>
